name: Azure Static Web Apps CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4  # Upgrade to v4
        with:
          submodules: true
          lfs: false
          
      # Add explicit Node.js 20 setup
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Update to Node 20
          
      # Add package.json engine check
      - name: Update package.json engines
        run: |
          if [ -f package.json ]; then
            # Check if engines field exists
            if grep -q '"engines"' package.json; then
              echo "Engines field exists in package.json"
            else
              # Add engines field
              node -e "const pkg = require('./package.json'); pkg.engines = { node: '>=20.0.0' }; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2));"
              echo "Added engines field to package.json"
            fi
          fi
          
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_DUNE_0DCEF3910 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ".next"  # For Next.js
          app_build_command: "npm run build"
          
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_DUNE_0DCEF3910 }}
          action: "close"